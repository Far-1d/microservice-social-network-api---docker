version: '3.8'

services:
  post:
    build: ./post/backend
    container_name: post_service
    ports:
      - "8001:8001"
    volumes:
      - ./post/backend:/app
    networks:
      - app-network
    depends_on:
      kafka:
        condition: service_healthy    
      redis:
        condition: service_started  
    env_file: ".env.docker"
    restart: unless-stopped

  user:
    build: 
      context: ./user/backend
      dockerfile: Dockerfile
    container_name: user_service
    ports:
      - "8000:8000"
    volumes:
      - ./user/backend:/app
    networks:
      - app-network
    depends_on:
      - redis
      - kafka
    env_file: ".env.docker"
    restart: unless-stopped
  
  user_consumer:
    build: 
      context: ./user/backend
      dockerfile: Dockerfile.consumer
    container_name: user_consumer
    networks:
      - app-network
    depends_on:
      kafka:
        condition: service_healthy
    env_file: ".env.docker"
    restart: unless-stopped

  redis:
    image: redis:latest
    hostname: redis
    container_name: redis
    ports:
      - "6379:6379"
    networks:
      - app-network
    volumes:
      - cache:/data

  kafka:
    image: confluentinc/cp-kafka:latest
    hostname: kafka
    container_name: kafka
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "kafka:9092", "--list"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s
    ports:
      - "9092:9092" # internal connections
      - "9094:9094" # external connections
    user: root
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller  # required!
      # KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,EXTERNAL://0.0.0.0:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:9093'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
    networks:
      - app-network
    volumes:
      - ./kafka-data:/tmp/kraft-combined-logs
    tmpfs:
      - /tmp

networks:
  app-network:
    driver: bridge
    name: app-network

volumes:
  kafka_data:
  cache:
